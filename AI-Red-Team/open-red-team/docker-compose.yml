# Open AI Red Team — base stack (air-gapped / on-prem)
#
# Layer 3 (LLM serving): vllm + vllm-preflight (production, `serving` profile)
#                        ollama + ollama-pull (PoC, `poc` profile)
# Layer 4 (red-team app):  ort (web dashboard server, always-on) / cli (`cli` profile)
#
# Dashboard (default):  docker compose up -d ort                 -> http://localhost:8081
# PoC (app + Ollama):   docker compose --profile poc up -d       (pulls the model first)
# Production serving:   ORT_LLM_BASE_URL=http://vllm:8000/v1 ORT_LLM_MODEL=qwen2.5-32b \
#                         docker compose --profile serving up -d
#
# Layer 5 (auth / observability) lives in docker-compose.infra.yml — it requires
# real secrets and is started explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml \
#     --profile auth --profile observability --profile monitoring up -d

services:
  # ---------------- Layer 4: red-team application (web dashboard server) ----------------
  ort:
    build: .
    image: ${REGISTRY:-}open-ai-red-team:${ORT_TAG:-latest}
    command: ["dashboard"]
    environment:
      ORT_PROVIDER: ${ORT_PROVIDER:-openweight}
      OPENWEIGHT_BASE_URL: ${ORT_LLM_BASE_URL:-http://ollama:11434/v1}
      OPENWEIGHT_MODEL: ${ORT_LLM_MODEL:-qwen2.5:32b}
      OPENWEIGHT_API_KEY: ${OPENWEIGHT_API_KEY:-ollama}
      ORT_SKILLS_DIR: /app/skills
      ORT_DASHBOARD_PORT: "8081"
      ORT_DB_PATH: /data/ort.db
      ORT_AUTH_SECRET: ${ORT_AUTH_SECRET:-}
      ORT_DISABLE_LOCAL_AUTH: ${ORT_DISABLE_LOCAL_AUTH:-}
      ORT_DASHBOARD_TOKEN: ${ORT_DASHBOARD_TOKEN:-}
      ORT_METRICS_TOKEN: ${ORT_METRICS_TOKEN:-}
      ORT_OIDC_ISSUER: ${ORT_OIDC_ISSUER:-}
      ORT_OIDC_AUDIENCE: ${ORT_OIDC_AUDIENCE:-}
      ORT_AUDIT_LOG: /data/audit.jsonl
      ORT_AUDIT_REQUIRED: ${ORT_AUDIT_REQUIRED:-0}
      ORT_SCOPE: ${ORT_SCOPE:-}
      ORT_SCOPE_DOMAINS: ${ORT_SCOPE_DOMAINS:-}
      ORT_SCOPE_MODE: ${ORT_SCOPE_MODE:-enforce}
      ORT_OPERATOR: ${ORT_OPERATOR:-}
      ORT_MAX_CONTEXT: ${ORT_MAX_CONTEXT:-}
      ORT_SKILL_BUDGET: ${ORT_SKILL_BUDGET:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
    volumes:
      - ./data:/data
    ports:
      - "${ORT_DASHBOARD_PORT:-8081}:8081"
    networks:
      - redteam
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8081/api/health',{headers:{Authorization:'Bearer '+process.env.ORT_DASHBOARD_TOKEN}}).then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(h=>{if(h.backend!=='ok')process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  # interactive CLI (manual operation over an attachable TTY)
  cli:
    build: .
    image: ${REGISTRY:-}open-ai-red-team:${ORT_TAG:-latest}
    profiles: ["cli"]
    command: ["chat"]
    environment:
      ORT_PROVIDER: ${ORT_PROVIDER:-openweight}
      OPENWEIGHT_BASE_URL: ${ORT_LLM_BASE_URL:-http://ollama:11434/v1}
      OPENWEIGHT_MODEL: ${ORT_LLM_MODEL:-qwen2.5:32b}
      OPENWEIGHT_API_KEY: ${OPENWEIGHT_API_KEY:-ollama}
      ORT_SKILLS_DIR: /app/skills
      ORT_SCOPE: ${ORT_SCOPE:-}
      ORT_SCOPE_DOMAINS: ${ORT_SCOPE_DOMAINS:-}
      ORT_SCOPE_MODE: ${ORT_SCOPE_MODE:-enforce}
      ORT_OPERATOR: ${ORT_OPERATOR:-}
      ORT_MAX_CONTEXT: ${ORT_MAX_CONTEXT:-}
      ORT_SKILL_BUDGET: ${ORT_SKILL_BUDGET:-}
    networks:
      - redteam
    read_only: true
    tmpfs:
      - /tmp
    stdin_open: true
    tty: true

  # ---------------- Layer 3: LLM serving ----------------
  vllm-preflight:
    image: alpine:3.20
    profiles: ["serving"]
    command:
      [
        "/bin/sh",
        "-c",
        "if [ ! -d \"$${VLLM_MODEL_ID}\" ] || [ -z \"$$(ls -A \"$${VLLM_MODEL_ID}\" 2>/dev/null)\" ]; then echo 'vLLM weights missing: VLLM_MODEL_ID=$${VLLM_MODEL_ID} (mount them under MODELS_DIR)' >&2; echo 'missing env: VLLM_MODEL_ID, MODELS_DIR' >&2; exit 1; fi; echo 'vLLM weights found'",
      ]
    environment:
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-/models/Qwen2.5-32B-Instruct}
    volumes:
      - ${MODELS_DIR:-./artifacts/models}:/models:ro
    networks:
      - redteam

  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-latest}
    profiles: ["serving"]
    command: >-
      --model ${VLLM_MODEL_ID:-/models/Qwen2.5-32B-Instruct}
      --served-model-name ${ORT_LLM_MODEL:-qwen2.5-32b}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.9}
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_CACHE_ROOT: /cache
    volumes:
      - ${MODELS_DIR:-./artifacts/models}:/models:ro
      - vllm-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "8000"
    networks:
      - redteam
    tmpfs:
      - /tmp
    depends_on:
      vllm-preflight:
        condition: service_completed_successfully
        required: false

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    profiles: ["poc"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - redteam
    mem_limit: ${OLLAMA_MEM_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    profiles: ["poc"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:32b}",
      ]
    environment:
      OLLAMA_HOST: ollama:11434
    networks:
      - redteam
    depends_on:
      ollama:
        condition: service_healthy

networks:
  redteam:
    driver: bridge
    # air-gapped deployments: set internal=true to prevent egress
    internal: ${NETWORK_INTERNAL:-false}

volumes:
  ollama-data:
  vllm-cache:
