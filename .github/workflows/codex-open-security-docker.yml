name: Publish Codex Open Security Docker image

on:
  push:
    tags:
      - "codex-open-security-v*"
    paths:
      - "Codex-Security-KiMI-K3/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/codex-open-security

jobs:
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codex-Security-KiMI-K3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/codex-open-security"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/codex-open-security-v* ]]; then
            VER="${GITHUB_REF_NAME#codex-open-security-v}"
            echo "tags=${IMAGE}:${VER},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ inputs.tag || 'latest' }}"
            echo "tags=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Codex-Security-KiMI-K3
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
