name: Open AI Red Team CI

on:
  push:
    paths:
      - "AI-Red-Team/open-red-team/**"
  pull_request:
    paths:
      - "AI-Red-Team/open-red-team/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Red-Team/open-red-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI-Red-Team/open-red-team/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build container image
        run: docker build -t open-ai-red-team:test .
      - name: Scan image (SBOM + CVE gate)
        run: |
          bash scripts/sbom/scan.sh open-ai-red-team:test artifacts/sbom \
            || { echo "::error::Trivy scan failed"; exit 1; }
        env:
          EXIT_ON: HIGH,CRITICAL
